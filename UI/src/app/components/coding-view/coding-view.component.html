@if (selectedAttemptQuestion(); as item) {
  <div class="exam-page">
    <app-exam-header
      title="Skill Verification Exam"
      [remainingSeconds]="remainingSeconds()"
      (submitExam)="submitSolution()"
    />

    <app-question-navigation
      [questions]="attemptQuestions()"
      [selectedIndex]="selectedQuestionIndex()"
      (questionSelected)="selectQuestion($event)"
    />

    <div class="exam-layout">
      <section class="question-panel" aria-label="Question details">
        <div class="question-heading">
          <span class="eyebrow">QUESTION {{ item.position }}</span>
          <span class="question-type">
            {{ item.question.questionType }}
          </span>
        </div>

        <h3>Problem description</h3>
        <p class="question-content">
          {{ item.question.questionContent }}
        </p>

        <app-code-run 
          [codeRunOutput]="codeRunOutput()"
          [testCaseResults]="testCaseResults()"  
        />
      </section>

      <section class="editor-panel" aria-label="Code editor">
        <div class="editor-toolbar">
          <div class="editor-heading">
            <h3>Code editor</h3>
          </div>

          <div class="editor-actions">
            <button type="button" class="btn-run" (click)="runCode()">
              Run All Tests
            </button>
            <button
              type="button"
              class="btn-run-custom"
              (click)="runCustomInput()"
            >
              Run Custom Input
            </button>
          </div>
        </div>

        <div class="editor-container">
          <ngx-monaco-editor
            [options]="editorOptions()"
            [ngModel]="code()"
            (ngModelChange)="onCodeChange($event)"
            class="h-100 w-100">
          </ngx-monaco-editor>
        </div>

        <div class="custom-input-panel">
          <h4>Custom input</h4>
          <p>Provide input to test your code manually.</p>

          <label for="testCaseInput">Standard input (stdin)</label>
          <textarea
            id="testCaseInput"
            class="custom-input"
            [ngModel]="codeRunInput()"
            (ngModelChange)="codeRunInput.set($event)"
            rows="4"
            spellcheck="false">
          </textarea>
        </div>
      </section>
    </div>
  </div>
}
